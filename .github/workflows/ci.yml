name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# The ONE place each tool version appears — every job reads these.
#
# DSH is pinned rather than `@alpha`: the compat guard asserts this exact build
# still declares the slots the plugin patches, so a floating tag would turn
# upstream drift into an unexplained red build. Bump it here and the guard, the
# Playwright profile and the pkg build all move together.
#
# pnpm is pinned because the lockfile is shared: CI and every dev machine must
# resolve it with the same store layout. Verified that 12.11.2 accepts the
# existing lockfile unchanged (`--frozen-lockfile` → "Lockfile is up to date").
env:
  DSH_VERSION: 0.2.2-alpha.2
  PNPM_VERSION: 12.11.2

jobs:
  test:
    name: Typecheck & unit/e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Build lib/
        run: pnpm build

      # tests/unit/compat.test.mjs asserts the installed DSH still exposes the
      # three patched SlotRegistry methods and still declares each managed slot
      # as a root-scoped list slot. It SKIPS when no DSH is found, which is the
      # default locally — so without this step the guard would be inert on CI and
      # a DSH upgrade could break the plugin silently.
      # `npm --prefix` needs the directory to exist first.
      - name: Install dsh for the compatibility guard
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-compat"
          npm install --no-save --prefix "$RUNNER_TEMP/dsh-compat" "@deepseek-ai/dsh@$DSH_VERSION"

      - name: Run unit + e2e tests
        run: pnpm test
        env:
          DSH_INSTALL_DIR: ${{ runner.temp }}/dsh-compat/node_modules/@deepseek-ai/dsh

  playwright:
    name: Playwright functional test
    runs-on: ubuntu-latest
    # Links the plugin from this checkout into an auto-created profile, so it
    # tests the actual code under test (works on PRs and main).
    needs: [test]
    env:
      DSH_HOME: /tmp/dsh-home-pw
      DSH_PORT: "3100"
      DSH_WEB_URL: "http://127.0.0.1:3100"
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps & build lib/
        run: |
          pnpm install
          pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Create profile & link this plugin (dsh auto-creates the profile)
        run: |
          pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" plugin --profile web add "$GITHUB_WORKSPACE"
          echo "profile ready with linked dsh-slots-manager"

      - name: Verify dsh can compose the profile
        working-directory: ${{ env.DSH_HOME }}/profiles/web
        run: pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" --profile web --dump-config > /tmp/dump.yml

      - name: Start dsh web server
        working-directory: ${{ env.DSH_HOME }}/profiles/web
        run: |
          pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" --profile web --host 127.0.0.1 --port "$DSH_PORT" --no-open > /tmp/dsh-e2e.log 2>&1 &
          echo "PID=$!" >> "$GITHUB_ENV"
          echo "e2e: server PID=$! port=$DSH_PORT"
          # The root gate answers 401 until the browser exchanges the boot
          # token; readiness means the token URL has been printed.
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$DSH_PORT" || true)"
            if grep -qE 'https?://[^ ]+\?token=' /tmp/dsh-e2e.log; then
              echo "Server ready after ${i}s (HTTP $code)"
              break
            fi
            sleep 1
          done
          if ! grep -qE 'https?://[^ ]+\?token=' /tmp/dsh-e2e.log; then
            echo "::error::dsh web server did not become ready"
            cat /tmp/dsh-e2e.log
            exit 1
          fi

      - name: Run Playwright tests
        working-directory: tests/playwright
        run: npx playwright test --config playwright.config.mjs

      - name: Stop dsh web server
        if: always()
        run: |
          kill "$PID" 2>/dev/null || true
          pkill -f "dsh --profile web --host 127.0.0.1 --port $DSH_PORT" 2>/dev/null || true

      - name: Show dsh boot log on failure
        if: failure()
        run: cat /tmp/dsh-e2e.log

  pkg:
    name: Build & push pkg branch
    runs-on: ubuntu-latest
    # Build the distribution branch only after the FULL suite passes
    # (unit/e2e + Playwright), since the profile consumes #pkg directly.
    needs: [test, playwright]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps & build lib/
        run: |
          pnpm install
          pnpm build

      - name: Strip prepare for the pkg (distribution) branch
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));if(p.scripts&&p.scripts.prepare)delete p.scripts.prepare;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Commit lib/ + package.json and force-push pkg branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lib/ package.json
          git commit -m "pkg: rebuild lib/ for main ${{ github.sha }}"
          git branch -f pkg HEAD
          git push -f origin pkg
